# ---------------------------------------------------------------------------
# Mid-asm hooks
#
# These replace hand-edits to generated/*.cpp, which `rexglue codegen` wipes.
# Implementations live in src/midnightclub_hooks.cpp.
# ---------------------------------------------------------------------------

# 0x821BDAB0 is `subf r8,r10,r11` in sub_821BDA90 — r8 becomes the elapsed
# guest tick count for this frame. Clamp it so a streaming stall cannot feed an
# unbounded delta into the physics and audio clocks. Also the once-per-frame
# site used for frame-time instrumentation.
[[midasm_hook]]
name = "MCLAFrameDelta"
address = 0x821BDAB0
after_instruction = true
registers = ["r8"]

# Skip ONLY the fixed-timestep overwrite, nothing else.
#
# This hook used to sit at 0x821BDB08 (the `bne cr6,0x821BDBC8` that Xenia
# patches) and jump to loc_821BDC34 whenever the "timer was reset" flag at
# [r3+56] was clear. That bypassed far too much: the block at
# loc_821BDB10..loc_821BDB58 also advances [r3+20] and [r3+24], the engine's
# running accumulated-time totals. Measured result — they advanced exactly once
# and then sat frozen at 0.0333 for the rest of the session.
#
# 0x821BDB58 is the start of the fixed-timestep block proper: it compares the
# measured delta against [r3+32] and overwrites [r3+8]/[r3+88] with the fixed
# step (loc_821BDB80), or sets the "skip frame" flag at [r3+52]. Jumping from
# here to loc_821BDC34 skips exactly that and nothing more.
#
# What now runs normally again:
#   - the [r3+56] reset guard at 0x821BDB08 -> loc_821BDBC8 (kept, as before)
#   - [r3+16] = [r3+20]  (previous-accumulated save)
#   - [r3+20] += delta, [r3+24] += delta  (the frozen accumulators)
#
# Note loc_821BDB90 (taken when [r3+58] or [r3+60] are set) still does its own
# fixed-step overwrite. That is original behaviour for that state and we have no
# evidence it is wrong, so it is deliberately left alone.
[[midasm_hook]]
name = "MCLAUseRealDelta"
address = 0x821BDB58
jump_address = 0x821BDC34

# 0x82419AA0 is `li r11,2` in sub_824199B0, which builds a PM4 packet — r11 is
# the present interval in vblanks, shifted into the packet field at 0x82419AB4.
# 2 = present every other vblank = 30 FPS. Force 1.
[[midasm_hook]]
name = "MCLAPresentInterval"
address = 0x82419AA0
after_instruction = true
registers = ["r11"]

# 0x822C2434 is `mr r23,r24` in sub_822C1FA8, immediately before the substep
# loop. r24 is the substep count.
#
# The loop runs r24+1 times: r24 iterations with dt/r24, then a final iteration
# at FULL dt (r23==0 takes the r4=0 path, which makes sub_821BD910 restore the
# saved full delta). So simulated time per frame is dt when r24==0, but 2*dt
# whenever r24 > 0.
#
# Read-only instrumentation: records the value so we can see whether r24 is 0
# at 30 fps and non-zero at 60 fps.
[[midasm_hook]]
name = "MCLASubstepCount"
address = 0x822C2434
registers = ["r24"]

# 0x822C2478 is `lfs f30, 8(r27)` inside the substep loop, immediately after
# sub_821BD910 has set [r27+8] to the delta for THIS iteration. Summing that
# across every iteration of every frame gives the total simulated time the
# engine advances per unit of real time.
#
# This is the ground-truth measurement: if the sum over one real second is
# ~1.0 the simulation is running at correct speed, if it is ~2.0 it is running
# at double. It settles the question without relying on how the game feels.
[[midasm_hook]]
name = "MCLASubstepDelta"
address = 0x822C2478
registers = ["r27"]

