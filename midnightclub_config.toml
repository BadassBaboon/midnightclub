# ---------------------------------------------------------------------------
# Mid-asm hooks
#
# These replace hand-edits to generated/*.cpp, which `rexglue codegen` wipes.
# Implementations live in src/midnightclub_hooks.cpp.
# ---------------------------------------------------------------------------

# 0x821BDAB0 is `subf r8,r10,r11` in sub_821BDA90 — r8 becomes the elapsed
# guest tick count for this frame. Clamp it so a streaming stall cannot feed an
# unbounded delta into the physics and audio clocks. Also the once-per-frame
# site used for frame-time instrumentation.
[[midasm_hook]]
name = "MCLAFrameDelta"
address = 0x821BDAB0
after_instruction = true
registers = ["r8"]

# Skip ONLY the fixed-timestep overwrite, nothing else.
#
# This hook used to sit at 0x821BDB08 (the `bne cr6,0x821BDBC8` that Xenia
# patches) and jump to loc_821BDC34 whenever the "timer was reset" flag at
# [r3+56] was clear. That bypassed far too much: the block at
# loc_821BDB10..loc_821BDB58 also advances [r3+20] and [r3+24], the engine's
# running accumulated-time totals. Measured result — they advanced exactly once
# and then sat frozen at 0.0333 for the rest of the session.
#
# 0x821BDB58 is the start of the fixed-timestep block proper: it compares the
# measured delta against [r3+32] and overwrites [r3+8]/[r3+88] with the fixed
# step (loc_821BDB80), or sets the "skip frame" flag at [r3+52]. Jumping from
# here to loc_821BDC34 skips exactly that and nothing more.
#
# What now runs normally again:
#   - the [r3+56] reset guard at 0x821BDB08 -> loc_821BDBC8 (kept, as before)
#   - [r3+16] = [r3+20]  (previous-accumulated save)
#   - [r3+20] += delta, [r3+24] += delta  (the frozen accumulators)
#
# Note loc_821BDB90 (taken when [r3+58] or [r3+60] are set) still does its own
# fixed-step overwrite. That is original behaviour for that state and we have no
# evidence it is wrong, so it is deliberately left alone.
[[midasm_hook]]
name = "MCLAUseRealDelta"
address = 0x821BDB58
jump_address = 0x821BDC34

# loc_821BDB90 — the OTHER fixed-timestep path, taken when [r3+58] or [r3+60]
# are set. Measured: leaving this alone made the sim run at 2x at 60 fps
# (SIM RATE 4.00x vs the correct 2.00x, accumulators +1.97/s vs +1.00/s).
#
#   0x821BDB90  lfs f11,32(r3)     ; f11 = FIXED timestep
#   0x821BDB98  fmuls f0,f11,f13   ; f0  = fixed * timescale
#   0x821BDB9C  stfs f11,88(r3)    ; overwrite unscaled delta
#   0x821BDBA0  stfs f0,8(r3)      ; overwrite scaled delta   <-- the 2x
#   0x821BDBAC  fadds f9,f0,f12    ; and accumulates the fixed delta too
#
# Rather than bypass the block (which would lose its accumulator updates, the
# mistake that froze [r3+20] last time), just replace the value it loads.
# Overwriting f11 with the measured unscaled delta — still intact in [r3+88] at
# this point, written at 0x821BDAF8 and not clobbered until 0x821BDB9C — makes
# every instruction downstream do the right thing on its own: f0 becomes
# measured*timescale, both stores write measured values, and the accumulators
# advance by the measured delta.
[[midasm_hook]]
name = "MCLAFixedStepPath"
address = 0x821BDB90
after_instruction = true
registers = ["r3", "f11"]

# 0x82419AA0 is `li r11,2` in sub_824199B0, which builds a PM4 packet — r11 is
# the present interval in vblanks, shifted into the packet field at 0x82419AB4.
# 2 = present every other vblank = 30 FPS. Force 1.
[[midasm_hook]]
name = "MCLAPresentInterval"
address = 0x82419AA0
after_instruction = true
registers = ["r11"]

# 0x822C2434 is `mr r23,r24` in sub_822C1FA8, immediately before the substep
# loop. r24 is the substep count.
#
# The loop runs r24+1 times: r24 iterations with dt/r24, then a final iteration
# at FULL dt (r23==0 takes the r4=0 path, which makes sub_821BD910 restore the
# saved full delta). So simulated time per frame is dt when r24==0, but 2*dt
# whenever r24 > 0.
#
# Read-only instrumentation: records the value so we can see whether r24 is 0
# at 30 fps and non-zero at 60 fps.
[[midasm_hook]]
name = "MCLASubstepCount"
address = 0x822C2434
registers = ["r24"]

# 0x822C2478 is `lfs f30, 8(r27)` inside the substep loop, immediately after
# sub_821BD910 has set [r27+8] to the delta for THIS iteration. Summing that
# across every iteration of every frame gives the total simulated time the
# engine advances per unit of real time.
#
# This is the ground-truth measurement: if the sum over one real second is
# ~1.0 the simulation is running at correct speed, if it is ~2.0 it is running
# at double. It settles the question without relying on how the game feels.
[[midasm_hook]]
name = "MCLASubstepDelta"
address = 0x822C2478
registers = ["r27"]

# 0x822A2ED4: lfs f0, 12(r20)
# This loads the timestep used by the steering physics update. It is a fixed
# constant in the original game (0.0333333), causing the car to steer twice
# as fast at 60 FPS since the substep loop runs twice as often.
[[midasm_hook]]
name = "MCLATurnSpeedTimestep"
address = 0x822A2ED4
after_instruction = true
registers = ["f0"]


# 0x823203D4: fmr f1, f27
# This is in sub_82320298 (likely mcPlayerCamera::Update). f1 is the interpolation
# constant passed to sub_8231D3A8 (generic Lerp/Slerp). Applying the exponential
# decay fix here scales the camera boom speed correctly for 60 FPS without poisoning
# the generic math functions (which broke cockpit and HUD).
[[midasm_hook]]
name = "MCLACameraBoomSmoothing"
address = 0x823203D4
after_instruction = true
registers = ["f1"]

# 0x826F5CA0: blr in sub_826F5B18 (mcAmbientDensityTuning constructor)
# 0x826F4E3C: mr r3,r29 in sub_826F4CB8 (immediately after density_tuning.xml load)
# Dynamic ambient density tuning hook for MCLA_TRAFFIC_UNSPAWN_MAX, MCLA_PED_DENSITY_SCALE, MCLA_PARKED_CAR_SCALE.
[[midasm_hook]]
name = "MCLAAmbientDensityTuning"
address = 0x826F5CA0
registers = ["r3"]

[[midasm_hook]]
name = "MCLAAmbientDensityTuning"
address = 0x826F4E3C
registers = ["r31"]

[functions]
# RaceGrid_SetPosition entry point (0x82264760) and RaceGrid_GetPosition entry point
# (0x82264770): script native commands registered by sub_82264780. The script VM calls
# these at race start to place cars on the starting grid. Without them, cars are never
# positioned, manifesting as tilted/floating spawn and a broken showcase camera.
# Confirmed via stubs.txt: both were hit 30+ times per race start from LR=0x82555CCC
# (inside the script VM dispatcher sub_82554E20).
0x82264760 = { is_function_start = true }
0x82264770 = { is_function_start = true }

# 0x82554080: script VM native command dispatch helper. Called by the script interpreter
# when invoking native commands including the race-grid setters above. Also missing from
# the function table (confirmed stubs.txt: 63 hits from LR=0x82555CCC).
0x82554080 = { is_function_start = true }

# 0x82262320: small leaf — reads a game-state flag bit into a script output slot.
# 0x822C9FE8: small buffer/queue pusher used during race scripts.
# Both called once or twice per session from the script VM (confirmed stubs.txt 2026-08-13).
0x82262320 = { is_function_start = true }
0x822C9FE8 = { is_function_start = true }

